name: fanout
# What fanning out to many subagents costs each agent (fanout.py).
on:
  push:
    branches: [feat/fanout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fanout:
    name: fanout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chanto-sh/chanto
          ref: main
          path: chanto-src
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: cargo build --release --locked --manifest-path chanto-src/Cargo.toml
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: ./install-agents.sh
      - name: Fan out
        env:
          BENCH_CHANTO_BIN: ${{ github.workspace }}/chanto-src/target/release/chanto
        run: |
          {
            echo
            echo "Limits raised to N, where config allows:"
            python3 fanout.py --agents chanto,codex --fan 100,500,1000 --reps 3 --limit 240 --raised --json fanout-raised.json
          } | tee -a fanout.md
          cat fanout.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: fanout-${{ matrix.os }}
          path: fanout.*
