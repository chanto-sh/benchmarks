# The runner's own tests, including a real sandbox smoke test (a fake agent
# under bubblewrap on Linux and sandbox-exec on macOS), on every push and pull
# request.
name: tests
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  runner:
    name: runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python3 -m unittest -v test_run test_meter
        env:
          BENCH_SANDBOX_SMOKE: "1"

  runner-macos:
    name: runner tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest -v test_run test_meter
        env:
          BENCH_SANDBOX_SMOKE: "1"
