# One endpoint for every Chanto (OpenAI chat, OpenAI Responses and Anthropic
# Messages formats), forwarding to the same hosted model with identical
# retry/backoff on rate limits. Start with: proxy.sh [model]
model_list:
  - model_name: bench-model
    litellm_params:
      model: os.environ/BENCH_UPSTREAM          # e.g. mistral/devstral-medium-latest
      api_key: os.environ/BENCH_UPSTREAM_KEY
      input_cost_per_token: __COST_IN__     # filled in by proxy.sh, for spend in the log
      output_cost_per_token: __COST_OUT__
litellm_settings:
  drop_params: true          # each Chanto sends its own extras; drop what the upstream can't take
  num_retries: 8             # rate limits (429) back off and retry the same way for every agent
  request_timeout: 300
  # No server-side web search or fetch: the sandbox can't block a search the
  # upstream runs for the agent (no_search.py, next to this file).
  callbacks: no_search.proxy_handler_instance
general_settings:
  master_key: sk-bench-local
