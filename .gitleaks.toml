# gitleaks: the default rules, minus known false positives. CI scans the full
# history on every push and pull request (.github/workflows/secrets.yml).
[extend]
useDefault = true

[[allowlists]]
description = "Result files record each task's SHA-256 checksum"
paths = ['''^results/.*\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_.+~-]+": "[0-9a-f]{64}",?$''']
